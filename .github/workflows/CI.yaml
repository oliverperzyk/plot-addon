# Validates whole codebase's code quality and builds the add-on.
---
name: Verify codebase.
on:
    push:
    pull_request:
permissions:
    contents: read
defaults:
    run:
        shell: bash
jobs:
    validate:
        name: Run checks on whole codebase.
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository.
              uses: actions/checkout@v7
            - name: Set up Bun.
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Install dependencies.
              run: bun install --frozen-lockfile
            - name: Check formatting of all files using Prettier.
              run: bun run format:check
            - name: Lint all files using ESLint.
              run: bun run lint
            - name: Run build.
              run: bun run build
